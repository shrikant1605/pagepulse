<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Pulse — URL Audit Tool</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --border: #2a2e37;
      --text: #e8eaed;
      --muted: #9aa0ab;
      --accent: #5b8cff;
      --good: #3fbf72;
      --bad: #e5544d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px;
    }
    h1 { font-size: 28px; margin-bottom: 4px; }
    p.subtitle { color: var(--muted); margin-top: 0; margin-bottom: 32px; }
    .search-row {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 640px;
    }
    input[type="text"] {
      flex: 1;
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
    }
    input[type="text"]:focus { outline: 2px solid var(--accent); }
    button {
      padding: 14px 22px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status-line { margin-top: 14px; color: var(--muted); min-height: 20px; font-size: 14px; }
    .error-box {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 8px;
      background: rgba(229, 84, 77, 0.12);
      border: 1px solid var(--bad);
      color: var(--bad);
      max-width: 640px;
      width: 100%;
    }
    .report {
      margin-top: 28px;
      width: 100%;
      max-width: 640px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .metric {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .metric .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    .metric .value { font-size: 20px; margin-top: 6px; font-weight: 600; word-break: break-word; }
    .metric.full { grid-column: 1 / -1; }
    .metric .value.status-ok { color: var(--good); }
    .metric .value.status-warn { color: var(--bad); }
    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <h1>Page Pulse</h1>
  <p class="subtitle">Paste a URL, get an instant audit report.</p>

  <div class="search-row">
    <input type="text" id="urlInput" placeholder="https://example.com" />
    <button id="auditBtn">Audit</button>
  </div>
  <div class="status-line" id="statusLine"></div>
  <div id="errorBox" style="display:none;" class="error-box"></div>

  <div class="report" id="report" style="display:none;"></div>

  <footer>
    Built for Digital Heroes Training Task ·
    <a href="https://digitalheroesco.com" target="_blank" rel="noopener">digitalheroesco.com</a>
  </footer>

  <script>
    const urlInput = document.getElementById('urlInput');
    const auditBtn = document.getElementById('auditBtn');
    const statusLine = document.getElementById('statusLine');
    const errorBox = document.getElementById('errorBox');
    const report = document.getElementById('report');

    async function runAudit() {
      const url = urlInput.value.trim();
      errorBox.style.display = 'none';
      report.style.display = 'none';
      report.innerHTML = '';

      if (!url) {
        showError('Enter a URL first.');
        return;
      }

      auditBtn.disabled = true;
      statusLine.textContent = 'Fetching and analyzing the page...';

      try {
        const res = await fetch('/api/audit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Something went wrong.');
          return;
        }

        statusLine.textContent = '';
        renderReport(data);
      } catch (err) {
        showError('Network error — could not reach the API.');
      } finally {
        auditBtn.disabled = false;
      }
    }

    function showError(message) {
      statusLine.textContent = '';
      errorBox.textContent = message;
      errorBox.style.display = 'block';
    }

    function renderReport(data) {
      const statusClass = data.httpStatus >= 200 && data.httpStatus < 400 ? 'status-ok' : 'status-warn';
      const altClass = data.imagesMissingAlt > 0 ? 'status-warn' : 'status-ok';

      report.innerHTML = `
        <div class="metric full">
          <div class="label">Audited URL</div>
          <div class="value">${escapeHtml(data.url)}</div>
        </div>
        <div class="metric">
          <div class="label">HTTP Status</div>
          <div class="value ${statusClass}">${data.httpStatus}</div>
        </div>
        <div class="metric">
          <div class="label">Response Time</div>
          <div class="value">${data.responseTimeMs} ms</div>
        </div>
        <div class="metric full">
          <div class="label">Title</div>
          <div class="value">${escapeHtml(data.title || '(none found)')}</div>
        </div>
        <div class="metric full">
          <div class="label">Meta Description</div>
          <div class="value">${escapeHtml(data.metaDescription || '(none found)')}</div>
        </div>
        <div class="metric">
          <div class="label">H1 Count</div>
          <div class="value">${data.h1Count}</div>
        </div>
        <div class="metric">
          <div class="label">Images Missing Alt</div>
          <div class="value ${altClass}">${data.imagesMissingAlt}</div>
        </div>
        <div class="metric full">
          <div class="label">Approx. Word Count</div>
          <div class="value">${data.wordCount}</div>
        </div>
      `;
      report.style.display = 'grid';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    auditBtn.addEventListener('click', runAudit);
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') runAudit();
    });
  </script>
</body>
</html>
